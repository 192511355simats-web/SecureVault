services:
  - type: web
    name: securevault
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --bind 0.0.0.0:$PORT app:app
    autoDeploy: true
    envVars:
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: SCHEDULER_TOKEN
        generateValue: true
      - key: SECUREVAULT_DATA_DIR
        value: /var/data/securevault-data
    disk:
      name: securevault-data
      mountPath: /var/data
      sizeGB: 1
